[server]
headless = true
# Don't re-run the whole app when unrelated files in the (large) venv change.
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Base colours and fonts; finer styling (chat layout, sources list, trust bar,
# hidden chrome) lives in ui/styles.css.
[theme]
base = "light"
primaryColor = "#173846"
backgroundColor = "#d5e2e8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#173846"
linkColor = "#29657e"
borderColor = "#97b8c6"
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
showSidebarBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, system-ui, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap, Charter, Georgia, serif"
headingFontWeights = 500
chartCategoricalColors = ["#173846", "#29657e", "#97b8c6", "#82a9ba"]

[theme.sidebar]
# White primary = white slider fill and handle; buttons are restyled in ui/styles.css.
primaryColor = "#FFFFFF"
backgroundColor = "#82a9ba"
secondaryBackgroundColor = "rgba(255, 255, 255, 0.4)"
textColor = "#173846"
borderColor = "#29657e"
