[server]
headless = true
# Don't re-run the whole app when unrelated files in the (large) venv change.
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#17394D"
backgroundColor = "#D5E1E8"
secondaryBackgroundColor = "#7FA6B8"
textColor = "#17394D"
